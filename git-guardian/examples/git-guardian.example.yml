# Git Guardian configuration
# Formats use placeholders: <type> <number> <ticket> <scope> <description>.
# Wrap optional parts in [ ], e.g. "<type>[(<scope>)]: <description>".
# secrets.allow takes comma-separated path globs that are never scanned, e.g. "test/fixtures/**".
version: 1
branch:
  enabled: true
  format: "<type>/<number>-<description>"
  types: "feat,chore,bugfix,task"
  protected: "main,master,develop,development,staging,production"
  suggestions: true
commit:
  enabled: true
  format: "<type>: <description>"
  types: "feat,chore,bugfix,task"
  maxSubjectLength: 72
  allowMergeCommits: true
  allowRevertCommits: true
secrets:
  enabled: true
  allow: ""
hooks:
  referenceTransaction: true
  commitMsg: true
